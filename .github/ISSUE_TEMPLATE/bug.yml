name: Bug report
description: Something in LoopCode is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues before filing a new one.
  - type: input
    id: version
    attributes:
      label: LoopCode version
      placeholder: 0.9.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Leave blank if this is not agent-specific.
      placeholder: Claude, Codex, Cursor, …
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
