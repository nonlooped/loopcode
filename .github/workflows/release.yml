name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: false
        default: stable
        type: choice
        options:
          - stable
          - nightly
      sha:
        description: Commit SHA for nightly builds
        required: false
        type: string

env:
  RELEASE_SHA: ${{ inputs.channel == 'nightly' && inputs.sha || github.sha }}
  RELEASE_CHANNEL: ${{ inputs.channel || 'stable' }}

concurrency:
  group: release-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Require full commit SHA
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful master CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$RELEASE_SHA" origin/master
          test -n "$(gh run list --workflow ci.yml --branch master --commit "$RELEASE_SHA" \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: meta
        name: Resolve release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="$(git rev-parse --short=12 "$RELEASE_SHA")"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_CHANNEL" == nightly ]]; then
            version="$(node scripts/nightly-version.mjs "$(jq -r .version package.json)" "$(date -u +%Y%m%d)" "$GITHUB_RUN_NUMBER")"
            tag="v$version"
            previous_tag="$(git tag -l 'v*-nightly.*' --sort=-creatordate | grep -vxF "$tag" | head -n 1)"
            if [[ -z "$previous_tag" ]]; then
              previous_tag="$(git tag -l 'v*' --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
            fi
            test -n "$previous_tag"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "title=LoopCode Nightly $version ($short_sha)" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$RELEASE_CHANNEL" = stable
          test "$GITHUB_REF_TYPE" = tag
          tag="$GITHUB_REF_NAME"
          previous_tag="$(git tag -l 'v*' --sort=-creatordate | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$tag" | head -n 1)"
          test -n "$previous_tag"
          gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          node scripts/check-versions.mjs "$tag"
          node scripts/release-notes.mjs "$tag" > /dev/null
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=LoopCode $tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

  bundle:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux-bundles
            cache-key: linux-rust-release
          - platform: windows-latest
            artifact: windows-bundles
            cache-key: windows-rust-release
          - platform: macos-latest
            artifact: macos-bundles
            cache-key: macos-rust-release
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - id: npm-cache
        name: Get npm cache directory
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: rustup toolchain install --no-self-update
      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache-key }}
      - name: Stamp nightly version
        if: env.RELEASE_CHANNEL == 'nightly'
        run: |
          node scripts/set-version.mjs "${{ needs.preflight.outputs.version }}"
          node scripts/check-versions.mjs
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        if: runner.os == 'Linux'
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
          version: 1.0
      - name: Install verified AppImage tools
        if: runner.os == 'Linux'
        run: |
          tools="$HOME/.cache/tauri"
          mkdir -p "$tools"
          curl --fail --location --retry 3 https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 --output "$tools/AppRun-x86_64"
          curl --fail --location --retry 3 https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage --output "$tools/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/b5eb8d05b4c0ed40107fe2158c5d8527f94568ef/linuxdeploy-plugin-gtk.sh --output "$tools/linuxdeploy-plugin-gtk.sh"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/2a2e67491c32995a3f279ad0ecbe77abd512b42a/linuxdeploy-plugin-gstreamer.sh --output "$tools/linuxdeploy-plugin-gstreamer.sh"
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage --output "$tools/linuxdeploy-plugin-appimage.AppImage"
          cd "$tools"
          sha256sum --check <<'SHA256'
          f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun-x86_64
          e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef  linuxdeploy-x86_64.AppImage
          cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a  linuxdeploy-plugin-gtk.sh
          c107b49d84edbffc6ab226ed1007e0626a4f7aa2c3a36b7782bef62351d49e94  linuxdeploy-plugin-gstreamer.sh
          a45d3e227bc7f397e9cf6bfa4c9507494efa2293357b6e86690a3de2ca992e79  linuxdeploy-plugin-appimage.AppImage
          SHA256
          chmod +x ./*
      - run: npm run tauri -- build --ci ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }} -- --locked
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=(src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app)
          codesign --verify --deep --strict "${app[0]}"
          archs="$(lipo -archs "${app[0]}/Contents/MacOS/LoopCode")"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
          if-no-files-found: error

  publish:
    needs: [preflight, bundle]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -type d -empty -delete 2>/dev/null || true
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_TITLE: ${{ needs.preflight.outputs.title }}
          PREVIOUS_TAG: ${{ needs.preflight.outputs.previous_tag }}
          SHORT_SHA: ${{ needs.preflight.outputs.short_sha }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          if [[ "$RELEASE_CHANNEL" == nightly ]]; then
            git log --format=%s "$PREVIOUS_TAG..$RELEASE_SHA" \
              | node scripts/release-notes.mjs "$RELEASE_TAG" "$SHORT_SHA" "$PREVIOUS_TAG" > release-notes.md
          else
            node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md
          fi
          printf '\n> Windows and Linux packages are unsigned. The macOS app is ad-hoc signed but not Developer ID signed or notarized. On macOS, move LoopCode to Applications, then run `xattr -dr com.apple.quarantine /Applications/LoopCode.app`. On Windows, SmartScreen may require **More info > Run anyway**. Only bypass these warnings for packages downloaded from this repository whose checksum matches `SHA256SUMS.txt`.\n\nThe macOS DMG supports Apple Silicon and Intel Macs.\n\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS_TAG" "$RELEASE_TAG" >> release-notes.md
          release="$(gh release view "$RELEASE_TAG" --json isDraft --repo "$GITHUB_REPOSITORY" 2> /dev/null || true)"
          if [[ -n "$release" && "$(jq -r .isDraft <<< "$release")" != true && "$RELEASE_CHANNEL" == stable ]]; then
            echo "release is already published: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$release" ]]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            edit_args=()
            if [[ "$RELEASE_CHANNEL" == nightly ]]; then
              edit_args=(--draft=false --prerelease --latest=false)
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" \
              --notes-file release-notes.md "${edit_args[@]}" --repo "$GITHUB_REPOSITORY"
          elif [[ "$RELEASE_CHANNEL" == nightly ]]; then
            gh release create "$RELEASE_TAG" "${files[@]}" --prerelease --latest=false \
              --target "$RELEASE_SHA" --notes-file release-notes.md \
              --title "$RELEASE_TITLE" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --draft --notes-file release-notes.md \
              --title "$RELEASE_TITLE" --repo "$GITHUB_REPOSITORY"
          fi

  cleanup-nightly-tag:
    if: ${{ always() && (inputs.channel || 'stable') == 'nightly' }}
    needs: [preflight, bundle, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_REF_NAME" == nightly-src-* ]] || exit 0
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --silent > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$GITHUB_REF_NAME"
          fi

  report-failure:
    if: ${{ always() && (needs.preflight.result == 'failure' || needs.bundle.result == 'failure' || needs.publish.result == 'failure') }}
    needs: [preflight, bundle, publish]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update release failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          title="Release workflow failed"
          body="$(printf '[Release run %s](%s/%s/actions/runs/%s) failed for `%s` at `%s`.\n\nPreflight: %s  \nBundle: %s  \nPublish: %s' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            "$RELEASE_CHANNEL" "$RELEASE_SHA" "$PREFLIGHT_RESULT" "$BUNDLE_RESULT" "$PUBLISH_RESULT")"
          issue="$(gh issue list --state open --search 'Release workflow failed in:title' --json number,title \
            --jq '.[] | select(.title == "Release workflow failed") | .number' | head -n 1)"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --assignee "$GITHUB_REPOSITORY_OWNER"
          fi
