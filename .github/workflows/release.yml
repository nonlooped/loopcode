name: Release

on:
  workflow_dispatch:

env:
  RELEASE_SHA: ${{ github.sha }}
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - name: Require release tag
        run: test "$GITHUB_REF_TYPE" = tag
      - name: Require successful master CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "CI / gate")][0].conclusion')"
          test "$conclusion" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^")"
          gh release view "$previous_tag" --repo "$GITHUB_REPOSITORY" > /dev/null
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - run: node scripts/check-versions.mjs "$RELEASE_TAG"
      - run: node scripts/release-notes.mjs "$RELEASE_TAG" > /dev/null

  bundle:
    needs: preflight
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: linux-bundles
            cache-key: linux-rust
          - platform: windows-latest
            artifact: windows-bundles
            cache-key: windows-rust
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12
      - run: npm ci
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: ${{ matrix.cache-key }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install verified AppImage tools
        if: runner.os == 'Linux'
        run: |
          tools="$HOME/.cache/tauri"
          mkdir -p "$tools"
          curl --fail --location --retry 3 https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64 --output "$tools/AppRun-x86_64"
          curl --fail --location --retry 3 https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage --output "$tools/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/b5eb8d05b4c0ed40107fe2158c5d8527f94568ef/linuxdeploy-plugin-gtk.sh --output "$tools/linuxdeploy-plugin-gtk.sh"
          curl --fail --location --retry 3 https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/2a2e67491c32995a3f279ad0ecbe77abd512b42a/linuxdeploy-plugin-gstreamer.sh --output "$tools/linuxdeploy-plugin-gstreamer.sh"
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage --output "$tools/linuxdeploy-plugin-appimage.AppImage"
          cd "$tools"
          sha256sum --check <<'SHA256'
          f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun-x86_64
          e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef  linuxdeploy-x86_64.AppImage
          cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a  linuxdeploy-plugin-gtk.sh
          c107b49d84edbffc6ab226ed1007e0626a4f7aa2c3a36b7782bef62351d49e94  linuxdeploy-plugin-gstreamer.sh
          a45d3e227bc7f397e9cf6bfa4c9507494efa2293357b6e86690a3de2ca992e79  linuxdeploy-plugin-appimage.AppImage
          SHA256
          chmod +x ./*
      - run: npm run tauri -- build --ci -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

  draft:
    needs: bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -type d -empty -delete 2>/dev/null || true
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          previous_tag="$(git describe --tags --abbrev=0 "$RELEASE_SHA^")"
          node scripts/release-notes.mjs "$RELEASE_TAG" > release-notes.md
          printf '\n> Windows and Linux packages are currently unsigned.\n\n**Full Changelog**: %s/%s/compare/%s...%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$RELEASE_TAG" >> release-notes.md
          release="$(gh release view "$RELEASE_TAG" --json isDraft --repo "$GITHUB_REPOSITORY" 2> /dev/null || true)"
          if [[ -n "$release" && "$(jq -r .isDraft <<< "$release")" != true ]]; then
            echo "release is already published: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ -n "$release" ]]; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "LoopCode $RELEASE_TAG" \
              --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" --draft --notes-file release-notes.md \
              --title "LoopCode $RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          fi
