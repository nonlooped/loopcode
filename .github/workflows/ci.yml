name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
      app: ${{ steps.paths.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Detect path filters
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed="$(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          fi
          node scripts/ci-paths.mjs <<< "$changed" >> "$GITHUB_OUTPUT"

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12.0.2
      - id: npm-cache
        name: Get npm cache directory
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - run: npm run check:versions
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-rust-ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
          version: 1.0
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-rust:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-rust-ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  macos-rust:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: macos-rust-ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  gate:
    name: CI / gate
    if: always()
    needs: [changes, frontend, rust, windows-rust, macos-rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      CHANGES: ${{ needs.changes.result }}
      FRONTEND: ${{ needs.frontend.result }}
      NATIVE: ${{ needs.changes.outputs.native }}
      RUST: ${{ needs.rust.result }}
      WINDOWS_RUST: ${{ needs.windows-rust.result }}
      MACOS_RUST: ${{ needs.macos-rust.result }}
    steps:
      - name: Require every applicable check
        run: |
          test "$CHANGES" = success
          test "$FRONTEND" = success
          if [[ "$NATIVE" == true ]]; then
            test "$RUST" = success
            test "$WINDOWS_RUST" = success
            test "$MACOS_RUST" = success
          else
            test "$RUST" = skipped
            test "$WINDOWS_RUST" = skipped
            test "$MACOS_RUST" = skipped
          fi

  tag-release:
    needs: [gate, changes]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Tag version bump
        id: release
        run: |
          version="$(jq -r .version package.json)"
          tag="v$version"
          subject="$(git log -1 --format=%s)"
          expected="chore(release): $tag"
          if [[ "$subject" != "$expected" ]]; then
            suffix="${subject#"$expected"}"
            [[ "$suffix" =~ ^\ \(#[0-9]+\)$ ]] || exit 0
          fi
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Start release
        if: steps.release.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
      - name: Start nightly
        if: ${{ !steps.release.outputs.tag && needs.changes.outputs.app == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git tag --points-at "$GITHUB_SHA" | grep -q -- '-nightly\.'; then
            echo "nightly already exists for $GITHUB_SHA"
            exit 0
          fi
          source_tag="nightly-src-$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rev-parse "$source_tag" >/dev/null 2>&1 || git tag "$source_tag" "$GITHUB_SHA"
          git push origin "$source_tag"
          gh workflow run release.yml --ref "$source_tag" -f channel=nightly -f sha="$GITHUB_SHA"
