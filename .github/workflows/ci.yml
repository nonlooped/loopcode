# Minimal CI for Slice 0: lint + test on Windows (host OS family).
# Multi-OS runners are deferred; see plan non-goals.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-test:
    name: Lint & test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install npm dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: SBOM
        run: npm run sbom

      - name: Checksums
        run: |
          npm run build
          npm run checksums

      - name: Spot regression (RC)
        run: npm run release:spot

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-windows
          path: |
            sbom/loopcode-sbom.json
            dist-release/SHA256SUMS.txt
