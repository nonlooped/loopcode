name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Detect native changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            changed="$(git diff-tree --root --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          fi
          if grep -Eq '^(src-tauri/|\.github/workflows/|rust-toolchain(\.toml)?$)' <<< "$changed"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global npm@12
      - run: npm ci
      - run: npm run check:versions
      - run: npm run check
      - run: npm test
      - run: npm run build

  rust:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: linux-rust
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-rust:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows-rust
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  gate:
    name: CI / gate
    if: always()
    needs: [changes, frontend, rust, windows-rust]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      CHANGES: ${{ needs.changes.result }}
      FRONTEND: ${{ needs.frontend.result }}
      NATIVE: ${{ needs.changes.outputs.native }}
      RUST: ${{ needs.rust.result }}
      WINDOWS_RUST: ${{ needs.windows-rust.result }}
    steps:
      - name: Require every applicable check
        run: |
          test "$CHANGES" = success
          test "$FRONTEND" = success
          if [[ "$NATIVE" == true ]]; then
            test "$RUST" = success
            test "$WINDOWS_RUST" = success
          else
            test "$RUST" = skipped
            test "$WINDOWS_RUST" = skipped
          fi
