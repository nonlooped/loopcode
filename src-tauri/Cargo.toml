[package]
name = "loopcode"
version = "0.9.0"
description = "A local desktop workspace for ACP coding agents."
license = "MIT"
authors = ["LoopCode contributors"]
homepage = "https://github.com/nonlooped/loopcode"
repository = "https://github.com/nonlooped/loopcode"
keywords = ["acp", "coding-agents", "desktop", "developer-tools", "tauri"]
categories = ["development-tools"]
edition = "2024"

[lib]
name = "loopcode_lib"
# LoopCode is desktop-only. Tauri's staticlib/cdylib outputs are needed for
# mobile targets and make MinGW attempt to export more symbols than PE allows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
atomic-write-file = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "sync", "time"] }
rfd = "0.17"
notify = "8"
ignore = "0.4"
portable-pty = "0.9.0"
process-wrap = { version = "10.0.0", default-features = false, features = [
  "tokio1",
  "kill-on-drop",
  "process-group",
  "job-object",
  "creation-flags",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
] }
